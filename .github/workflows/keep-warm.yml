name: Keep Render service warm

# Pings the live site so Render's free tier doesn't spin the service down
# (it sleeps after ~15 min idle, causing a ~30-50s cold-start loading screen).
# Scheduled workflows run only from the default branch (main).

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC); GitHub may delay a few minutes
  workflow_dispatch:          # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: |
          echo "Pinging at $(date -u) ..."
          code=$(curl -sS -L -m 120 --retry 3 --retry-delay 15 --retry-all-errors \
            -o /dev/null -w "%{http_code} in %{time_total}s" \
            https://mkulima-sokoni.onrender.com/) \
            && echo "OK -> $code" \
            || { echo "Ping failed (service may be waking up)"; exit 0; }
